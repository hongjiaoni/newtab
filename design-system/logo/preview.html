<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewTab logo options</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif; }
  body { margin: 0; padding: 24px 16px; background: #f2f2f7; color: #1c1c1e; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: #6e6e73; font-size: 14px; }
  .opt { display: grid; grid-template-columns: 150px repeat(3, minmax(0, 1fr)); gap: 10px; align-items: stretch; margin-bottom: 16px; }
  .label { padding: 12px 0; }
  .label b { display: block; font-size: 16px; margin-bottom: 4px; }
  .label span { font-size: 13px; color: #6e6e73; line-height: 1.5; }
  .stage { border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 8px; flex-wrap: wrap; }
  .light { background: #ffffff; }
  .dark { background: #1c1c1e; }
  .wall { background: radial-gradient(60% 80% at 15% 20%, #d9825a 0, transparent 60%), radial-gradient(60% 80% at 85% 15%, #6a5ccf 0, transparent 60%), radial-gradient(70% 80% at 80% 90%, #1f9aa8 0, transparent 60%), #31407a; }
  .stage img:nth-child(1) { width: 72px; height: 72px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.18)); }
  .stage img:nth-child(2) { width: 48px; height: 48px; }
  .stage img:nth-child(3) { width: 32px; height: 32px; }
  .stage img:nth-child(4) { width: 16px; height: 16px; }
  .head { display: grid; grid-template-columns: 150px repeat(3, minmax(0, 1fr)); gap: 12px; font-size: 12px; color: #6e6e73; margin-bottom: 6px; }
  .head div { text-align: center; }
</style>
</head>
<body>
  <h1>NewTab logo 方案</h1>
  <p class="lead">每行一个方案，分别放在浅色、深色和壁纸背景上；尺寸依次为 72 / 48 / 32 / 16 px（16px 即浏览器标签页图标）。</p>
