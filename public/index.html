<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Newtab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer-when-downgrade" />

  <script src="appearance.js?v=20261025-glass"></script>
  <link rel="stylesheet" href="tokens.css?v=20261025-glass" />
  <link rel="stylesheet" href="glass.css?v=20261025-glass" />
  <link rel="stylesheet" href="style.css?v=20261025-glass" />
  <link rel="stylesheet" href="wallpaper-modal.css?v=20261025-glass" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260131">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=20260131">
  <link rel="shortcut icon" href="/favicon.png?v=20260131">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260131">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Paddle.js SDK -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

  <!-- Google Sign-In (Legacy/Optional if using Supabase Auth completely) -->
  <!-- <script src="https://accounts.google.com/gsi/client" async defer></script> -->
</head>

<body>

  <!-- Settings Menu in top-right -->
  <div class="top-right-controls">
    <button id="settingsToggle" class="settings-btn hamburger-btn" aria-label="Menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <div id="settingsMenu" class="settings-menu hidden">
      <div class="settings-menu-item" id="modeMenuItem">
        <span id="modeMenuText">模式</span>
        <div id="modeSubmenu" class="settings-submenu hidden">
          <div onclick="setAppearanceViewMode('general')" data-mode-option="general" id="modeGeneral">一般</div>
          <div onclick="setAppearanceViewMode('minimalist')" data-mode-option="minimalist" id="modeMinimalist">极简</div>
        </div>
      </div>
      <div class="settings-menu-item" id="wallpaperMenuItem">
        <span id="wallpaperMenuText">壁纸</span>
      </div>
      <div class="settings-menu-item" id="settingsMenuItem">
        <span id="settingsMenuText">设置</span>
      </div>
      <div class="settings-menu-divider"></div>
      <div id="authMenuContainer"></div>
    </div>
  </div>

  <!-- Google Sign-In Modal -->
  <div id="googleSignInModal" class="modal-overlay hidden">
    <div class="modal google-signin-modal">
      <h3 id="googleSignInTitle">登录</h3>
      <div id="googleSignInContainer" style="text-align: center; padding: 20px;">
        <button id="googleLoginAction" class="primary-btn"
          style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">
          <img src="https://www.google.com/favicon.ico" width="18" height="18">
          <span id="googleLoginBtnText">Google 登录</span>
        </button>
        <!-- Legacy container hidden but kept for structure -->
        <div id="g_id_onload" data-client_id="608226137663-n7g5fqo6268rqs51nu6iv4m9d202phah.apps.googleusercontent.com"
          data-callback="handleCredentialResponse" data-auto_prompt="false" style="display:none">
        </div>
      </div>
      <div class="modal-actions">
        <button id="closeGoogleSignIn" class="cancel-btn">取消</button>
      </div>
    </div>
  </div>

  <main id="pager" class="pager">
    <section id="pageHome" class="page page-home" data-page="home" aria-labelledby="time">
      <div class="container">
        <div id="time" class="time">00:00</div>
        <div id="date" class="date"></div>

        <form id="searchForm" class="search-box">
          <div id="searchEngine" class="search-engine">
            <img id="engineIcon" src="" alt="Engine" />
            <div id="engineMenu" class="engine-menu hidden">
              <!-- Populated by JS -->
            </div>
          </div>
          <input id="searchInput" type="text" placeholder="想要搜点什么吗？" autocomplete="off" />
        </form>

        <!-- Content Area: pinned sites and tags -->
        <div id="content" class="content-area"></div>

        <div id="homeFooter" class="home-footer" style="display:none;"></div>
      </div>

      <button type="button" id="toWorkspaceBtn" class="to-workspace glass glass--capsule glass--clear">
        <span id="toWorkspaceText">工作台</span>
        <svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </section>

    <section id="pageWorkspace" class="page page-workspace" data-page="workspace" data-hash="workspace" aria-labelledby="workbenchHeader">
      <div class="workbench">
        <div class="workbench-header" id="workbenchHeader"></div>
        <div class="workbench-plugins">
          <div class="workbench-section-title" id="pluginsSectionTitle">工作台</div>
          <div class="plugin-cards" id="pluginCards"></div>
        </div>
        <div class="workbench-agent">
          <div class="workbench-section-title" id="agentSectionTitle">个人 Agent</div>
          <div class="agent-panel" id="agentPanel"></div>
        </div>
      </div>
    </section>
  </main>

  <nav id="pagerDots" class="pager-dock glass glass--capsule glass--clear" aria-label="Pages">
    <div class="pager-dots">
      <button type="button" id="dotHome" aria-label="首页" aria-current="true"></button>
      <button type="button" id="dotWorkspace" aria-label="工作台" aria-current="false"></button>
    </div>
  </nav>

  <!-- Context Menu -->
  <div id="contextMenu" class="context-menu hidden"></div>



  <!-- Wallpaper Selection Modal -->
  <div id="wallpaperModal" class="modal-overlay hidden">
    <div class="modal wallpaper-modal">
      <h3 id="wallpaperModalTitle">选择壁纸</h3>

      <div id="wallpaperTabs" class="wallpaper-tabs">
        <!-- Tabs rendered dynamically -->
      </div>

      <div class="wallpaper-content">
        <div id="wallpaperUploadContainer" class="wallpaper-upload-container hidden">
          <input type="file" id="wallpaperFileInput" class="hidden" accept="image/*">
          <button id="uploadWallpaperBtn" class="primary-btn"
            style="padding: 15px 30px; margin: 20px auto; display: block;">
            上传图片
          </button>
        </div>
        <div id="wallpaperGrid" class="wallpaper-grid"></div>
      </div>

      <div class="modal-actions">
        <button id="restoreDefaultWallpaper" class="cancel-btn">恢复默认</button>
        <button id="closeWallpaperModal" class="cancel-btn">关闭</button>
        <button id="saveWallpaperSelection" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- Search Engine Selection Modal -->
  <div id="engineModal" class="modal-overlay hidden">
    <div class="modal" style="max-width: 800px; width: 90%;">
      <h3 id="engineModalTitle">搜索引擎</h3>
      <div id="engineList" class="engine-grid">
        <!-- Populated by JS -->
      </div>
      <div class="pagination-controls" id="enginePagination">
        <!-- Populated by JS -->
      </div>
      <div class="modal-actions">
        <span id="engineCountHint" style="margin-right: auto; opacity: 0.7; font-size: 14px;"></span>
        <button id="closeEngineModal" class="cancel-btn">关闭</button>
        <button id="saveEngineSelection" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <h3 id="settingsModalTitle">设置</h3>
      <div class="appearance-panel">
        <div class="appearance-row">
          <label id="appearanceLabel">外观</label>
          <div class="segmented-control" id="appearanceGroup">
            <button class="seg-btn" data-appearance="light" id="apLight">浅色模式</button>
            <button class="seg-btn" data-appearance="dark" id="apDark">深色模式</button>
            <button class="seg-btn" data-appearance="auto" id="apAuto">跟随系统</button>
          </div>
        </div>
        <div class="appearance-row">
          <label id="zoomLabel">缩放</label>
          <div class="segmented-control" id="zoomGroup">
            <button class="seg-btn" data-zoom="100">100%</button>
            <button class="seg-btn" data-zoom="125">125%</button>
            <button class="seg-btn" data-zoom="150">150%</button>
          </div>
        </div>
        <div class="appearance-row">
          <label id="timeFormatLabel">时间格式</label>
          <div class="segmented-control" id="timeFormatGroup">
            <button class="seg-btn" data-time-format="24h" id="tf24">24 小时</button>
            <button class="seg-btn" data-time-format="12h" id="tf12">12 小时</button>
          </div>
        </div>
        <div class="appearance-row">
          <label id="settingsLangLabel">语言</label>
          <select id="settingsLangSelect" class="modal-input">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>
        <div class="appearance-row">
          <label id="openBehaviorLabel">页面打开方式</label>
          <div class="segmented-control" id="openBehaviorGroup">
            <button class="seg-btn" data-open-behavior="newtab" id="obNew">新标签页打开</button>
            <button class="seg-btn" data-open-behavior="current" id="obCurrent">当前页打开</button>
          </div>
        </div>
        <div class="appearance-row">
          <button id="settingsAboutBtn" class="cancel-btn" style="width:100%;">关于</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="closeSettingsModal" class="cancel-btn">关闭</button>
      </div>
    </div>

    <!-- Rename Modal -->
    <div id="renameModal" class="modal hidden">
      <h3 id="renameTitle">重命名</h3>
      <div class="modal-section">
        <label class="section-label" id="renameLabel">文件夹名称</label>
        <input type="text" id="renameInput" class="modal-input" placeholder="输入新名称" />
      </div>
      <div class="modal-actions">
        <button id="closeRenameModal" class="cancel-btn">取消</button>
        <button id="saveRename" class="primary-btn">保存</button>
      </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="addModal" class="modal hidden">
      <h3 id="addModalTitle">Add New</h3>
      <div class="modal-type-switch">
        <label><input type="radio" name="addType" value="site" checked> <span id="typeLabel1">Site</span></label>
        <label><input type="radio" name="addType" value="tag"> <span id="typeLabel2">Tag</span></label>
      </div>

      <div id="siteForm">
        <div class="modal-section">
          <label class="section-label" id="nameLabel">Name</label>
          <input type="text" id="siteName" placeholder="Name" class="modal-input" />
        </div>

        <div class="modal-section">
          <label class="section-label" id="urlLabel">URL</label>
          <input type="url" id="siteUrl" placeholder="URL (https://...)" class="modal-input" />
        </div>

        <div class="modal-section">
          <label class="section-label" id="selectTagsLabel">Select Tags</label>
          <div class="tags-select" id="tagSelector">
            <!-- Checkboxes for tags -->
          </div>
        </div>

        <div class="modal-section">
          <label class="checkbox-label">
            <input type="checkbox" id="showOnHome" checked> <span id="pinToHomeLabel">Pin to Home</span>
          </label>
        </div>
      </div>

      <div id="tagForm" class="hidden">
        <div class="modal-section">
          <label class="section-label" id="tagNameLabel">Tag Name</label>
          <input type="text" id="tagName" placeholder="Tag Name" class="modal-input" />
        </div>
      </div>

      <div class="modal-actions">
        <button id="closeAddModal" class="cancel-btn">Cancel</button>
        <button id="saveItem" class="primary-btn">Save</button>
      </div>
    </div>

    <!-- Tag View Modal -->
    <div id="tagViewModal" class="modal hidden">
      <h3 id="tagViewTitle">Tag Name</h3>
      <div id="tagViewLinks" class="tag-links-grid"></div>
      <div class="modal-actions">
        <button id="closeTagModal">Close</button>
      </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal hidden">
      <h3 id="deleteTitle">Delete Item</h3>
      <p id="deleteMessage" style="margin-bottom: 20px;">Are you sure?</p>
      <div class="modal-actions">
        <button id="cancelDelete" class="cancel-btn">Cancel</button>
        <button id="confirmDelete" class="logout-btn">Delete</button>
      </div>
    </div>

    <!-- User Profile Modal -->
    <div id="userProfileModal" class="modal hidden">
      <h3 id="userProfileTitle">User Profile</h3>
      <div id="userProfileContent" class="profile-content">
        <!-- Populated by JS -->
      </div>
      <div class="modal-actions">
        <button id="closeUserProfile" class="cancel-btn">Close</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </div>

    <!-- Subscription Records Modal -->
    <div id="subscriptionRecordsModal" class="modal hidden">
      <h3 id="subscriptionRecordsTitle">订阅记录</h3>
      <div id="subscriptionRecordsContent" class="profile-content">
        <!-- Populated by JS -->
      </div>
      <div class="modal-actions">
        <button id="backToUserProfile" class="cancel-btn">返回</button>
        <button id="closeSubscriptionRecords" class="cancel-btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- Paddle Inline Checkout Container (used in extension mode) -->
  <div id="paddle-checkout-container" class="hidden" style="position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;">
    <div id="paddle-inline-root" style="width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; background: var(--modal-bg, #fff); border-radius: 12px; padding: 20px;"></div>
  </div>

  <!-- About Modal -->
  <div id="aboutModal" class="modal-overlay hidden">
    <div class="modal" style="max-width: 500px;">
      <h3 id="aboutModalTitle">关于 NewTab</h3>
      <div style="text-align: center; padding: 20px;">
        <p style="margin-bottom: 20px; opacity: 0.8;" id="aboutDesc">简洁美观的新标签页，让每次打开浏览器都是一种享受。</p>
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
          <button id="aboutCoffeeAction" class="primary-btn" style="padding: 12px 24px;">
            <span id="coffeeBtn">请我喝杯咖啡</span>
          </button>
          <button id="aboutFeedbackAction" class="cancel-btn" style="padding: 12px 24px;">
            <span id="feedbackBtn">提交反馈</span>
          </button>
        </div>
        <div style="margin-top: 30px; font-size: 13px; opacity: 0.6;">
          <a href="https://www.newtab.online" target="_blank" style="color: inherit;" id="officialWebsiteLink">官网</a> ·
          v1.0.0
        </div>
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" id="aboutCloseBtn">关闭</button>
      </div>
    </div>
  </div>

  <!-- Buy Me a Coffee Modal -->
  <div id="coffeeModal" class="modal-overlay hidden">
    <div class="modal" style="max-width: 400px;">
      <h3 id="coffeeTitle">请我喝杯咖啡</h3>
      <div style="padding: 20px;">
        <p style="margin-bottom: 20px; opacity: 0.8;" id="coffeeDesc">如果你喜欢这个项目，可以请我喝杯咖啡表示支持！</p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;">
          <button class="coffee-amount-btn" data-amount="1">$1</button>
          <button class="coffee-amount-btn" data-amount="3">$3</button>
          <button class="coffee-amount-btn selected" data-amount="5">$5</button>
          <button class="coffee-amount-btn" data-amount="10">$10</button>
        </div>
        <div style="text-align: center;">
          <input type="number" id="coffeeCustomAmount" min="1" max="100" placeholder="自定义金额" class="modal-input"
            style="width: 150px; text-align: center;">
        </div>
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" id="coffeeCancelBtn">取消</button>
        <button class="primary-btn" id="coffeePayBtn">支付</button>
      </div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div id="feedbackModal" class="modal-overlay hidden">
    <div class="modal" style="max-width: 500px;">
      <h3 id="feedbackTitle">提交反馈</h3>
      <div style="padding: 20px;">
        <div class="modal-section">
          <label class="section-label" id="feedbackTypeLabel">反馈类型</label>
          <select id="feedbackType" class="modal-input">
            <option value="bug">Bug 报告</option>
            <option value="feature">功能建议</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="modal-section">
          <label class="section-label" id="feedbackContentLabel">反馈内容</label>
          <textarea id="feedbackContent" class="modal-input" rows="5" placeholder="请描述你的问题或建议..."
            style="resize: vertical;"></textarea>
        </div>
        <div class="modal-section">
          <label class="section-label" id="feedbackEmailLabel">联系邮箱（可选）</label>
          <input type="email" id="feedbackEmail" class="modal-input" placeholder="your@email.com">
        </div>
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" id="feedbackCancelBtn">取消</button>
        <button class="primary-btn" id="submitFeedbackBtn">提交</button>
      </div>
    </div>
  </div>

  <!-- Right-click Context Menu (for empty areas) -->
  <div id="pageContextMenu" class="page-context-menu hidden">
    <div class="context-menu-item" onclick="openAddSiteFromContext()">
      <span id="ctxAddSite">添加网站</span>
    </div>
    <div class="context-menu-item" data-onclick="openAddFolderFromContext()">
      <span id="ctxAddFolder">添加文件夹</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" onclick="openWallpaperFromContext()">
      <span id="ctxWallpaper">更换壁纸</span>
    </div>
  </div>

  <!-- Item Context Menu (for sites/tags) -->
  <div id="itemContextMenu" class="page-context-menu item-context-menu hidden">
    <div class="context-menu-item" onclick="editItemFromContext()">
      <span id="ctxEditItem">编辑</span>
    </div>
    <div class="context-menu-item" onclick="deleteItemFromContext()">
      <span id="ctxDeleteItem">删除</span>
    </div>
  </div>

  <script src="config.js?v=20261025-glass"></script>
  <script src="supabase-client.js"></script>
  <script src="wallpaper.js?v=20261025-glass"></script>
  <script src="paddle.js"></script>
  <script src="membership.js?v=20261025-glass"></script>
  <script src="auth.js?v=20261025-glass"></script>
  <script src="data-sync.js?v=20261025-glass"></script>
  <script src="pager.js?v=20261025-glass"></script>
  <script src="/script.js?v=20261025-glass"></script>
</body>

</html>
