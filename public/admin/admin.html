<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <title>运营后台 - Start Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-style.css" />
  <link rel="icon" href="../favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>

<body class="light">

  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <h2>Start Page</h2>
        <p>运营后台</p>
      </div>

      <nav class="admin-nav">
        <a href="#" class="nav-item active" onclick="switchTab('dashboard')">
          <span>📊</span>
          <span>仪表板</span>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('users')">
          <span>👥</span>
          <span>用户管理</span>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('wallpapers')">
          <span>🖼️</span>
          <span>壁纸管理</span>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('categories')">
          <span>📁</span>
          <span>分类管理</span>
        </a>
        <a href="#" class="nav-item" onclick="switchTab('logs')">
          <span>📝</span>
          <span>操作日志</span>
        </a>
      </nav>

      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Header -->
      <header class="admin-header">
        <h1 id="pageTitle">仪表板</h1>
        <div class="admin-user-info">
          <span id="adminName">Admin</span>
          <button onclick="toggleAdminMenu()" class="admin-menu-btn">⋯</button>
          <div id="adminMenu" class="admin-menu hidden">
            <a href="#" onclick="toggleTheme()">切换模式</a>
            <a href="#" onclick="adminLogout()">退出登录</a>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="admin-content">
        <!-- Dashboard Tab -->
        <div id="dashboardTab" class="admin-tab active">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon">👥</div>
              <div class="stat-content">
                <div class="stat-label">总用户数</div>
                <div class="stat-value" id="totalUsers">0</div>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">📅</div>
              <div class="stat-content">
                <div class="stat-label">今日登录</div>
                <div class="stat-value" id="todayLogins">0</div>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">🟢</div>
              <div class="stat-content">
                <div class="stat-label">在线用户</div>
                <div class="stat-value" id="onlineUsers">0</div>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">🖼️</div>
              <div class="stat-content">
                <div class="stat-label">壁纸总数</div>
                <div class="stat-value" id="totalWallpapers">0</div>
              </div>
            </div>
          </div>

          <!-- Trending Chart Section -->
          <div class="chart-section">
            <h3>用户登录趋势（最近7天）</h3>
            <div class="chart-container">
              <canvas id="trendingChart"></canvas>
            </div>
          </div>

          <!-- Session Info Section -->
          <div class="session-section">
            <h3>活跃会话信息</h3>
            <div class="session-info-container">
              <div id="sessionInfoContent" class="session-info-grid">
                <p style="text-align: center; color: #999;">加载中...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Users Tab -->
        <div id="usersTab" class="admin-tab hidden">
          <div class="admin-toolbar">
            <input type="text" id="userSearch" placeholder="搜索用户邮箱..." class="search-input">
            <button onclick="loadUsers()" class="btn btn-primary">刷新</button>
          </div>

          <div class="table-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>邮箱</th>
                  <th>名称</th>
                  <th>注册时间</th>
                  <th>最后登录</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr>
                  <td colspan="5" style="text-align: center;">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Wallpapers Tab -->
        <div id="wallpapersTab" class="admin-tab hidden">
          <div class="admin-toolbar">
            <button onclick="openUploadWallpaperModal()" class="btn btn-primary">上传壁纸</button>
            <select id="wallpaperCategory" onchange="loadWallpapers()" class="filter-select">
              <option value="">全部分类</option>
              <option value="landscape">风景</option>
              <option value="solid">纯色</option>
            </select>
          </div>

          <div class="wallpaper-grid-admin">
            <div id="wallpapersContainer"></div>
          </div>
        </div>

        <!-- Categories Tab -->
        <div id="categoriesTab" class="admin-tab hidden">
          <div class="admin-toolbar">
            <button onclick="openAddCategoryModal()" class="btn btn-primary">添加分类</button>
            <button onclick="loadCategories()" class="btn btn-secondary">刷新</button>
          </div>

          <div class="table-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>中文名称</th>
                  <th>英文名称</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="categoriesTableBody">
                <tr>
                  <td colspan="4" style="text-align: center;">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Logs Tab -->
        <div id="logsTab" class="admin-tab hidden">
          <div class="admin-toolbar">
            <button onclick="loadLogs()" class="btn btn-primary">刷新</button>
          </div>

          <div class="table-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>时间</th>
                  <th>管理员</th>
                  <th>操作</th>
                  <th>资源类型</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="logsTableBody">
                <tr>
                  <td colspan="5" style="text-align: center;">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Upload Wallpaper Modal -->
  <div id="uploadWallpaperModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>上传壁纸</h3>

      <div class="form-group">
        <label>标题</label>
        <input type="text" id="wallpaperTitle" placeholder="壁纸标题" class="form-input">
      </div>

      <div class="form-group">
        <label>描述</label>
        <textarea id="wallpaperDescription" placeholder="壁纸描述" class="form-input"></textarea>
      </div>

      <div class="form-group">
        <label>分类</label>
        <select id="wallpaperCategorySelect" class="form-input">
          <option value="landscape">风景</option>
          <option value="solid">纯色</option>
          <option value="daily">每日推荐</option>
        </select>
      </div>

      <div class="form-group">
        <label>图片URL</label>
        <input type="url" id="wallpaperImageUrl" placeholder="https://..." class="form-input">
      </div>

      <div class="form-group" id="colorGroup" style="display: none;">
        <label>颜色</label>
        <input type="color" id="wallpaperColor" class="form-input">
      </div>

      <div class="modal-actions">
        <button onclick="closeUploadWallpaperModal()" class="btn btn-secondary">取消</button>
        <button onclick="uploadWallpaper()" class="btn btn-primary">上传</button>
      </div>
    </div>
  </div>

  <!-- User Preview Modal -->
  <div id="userPreviewModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>用户首页预览</h3>
      <div id="userPreviewContent"></div>
      <div class="modal-actions">
        <button onclick="closeUserPreviewModal()" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div id="categoryModal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="categoryModalTitle">添加分类</h3>
      <div class="form-group">
        <label>中文名称</label>
        <input type="text" id="categoryName" placeholder="如：风景" class="form-input">
      </div>
      <div class="form-group">
        <label>英文名称</label>
        <input type="text" id="categoryNameEn" placeholder="如：Landscape" class="form-input">
      </div>
      <div class="modal-actions">
        <button onclick="closeCategoryModal()" class="btn btn-secondary">取消</button>
        <button onclick="saveCategory()" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>

</html>
